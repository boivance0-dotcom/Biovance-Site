name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22          # was 20 (deprecated) — bumped to clear the warning
      # npm install (NOT npm ci) so it doesn't require a perfectly-matched lockfile.
      # This is what fixes the build failure after adding the recharts dependency.
      - run: npm install
      # GitHub Pages serves from the /Biovance-Site/ subfolder, so build with that base.
      # (Cloudflare doesn't use this workflow — it builds at root with base '/'.)
      - run: npm run build
        env:
          VITE_BASE: /Biovance-Site/
      # SPA fallback so /search, /backend, etc. work on refresh / direct hit
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
